<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- 記事板的信紙（祐 2026-11-17）：獨立的透明小視窗，放在撫子旁邊。
     素材：assets/note/paper.webp（信紙，2:3）、pen_a.webp／pen_b.webp（白羽毛筆，每次打開隨機一支），都是祐用 GPT 生成。
     版面以信紙寬 W 為單位：視窗寬 1.24W、高 1.72W；信紙在左邊、往下 0.22W，右邊和上面留給羽毛筆。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<style>
  :root { --ink: #5b4636; --ink2: #8a6d4f; --gold: #c9a24a; --rose: #c2708a; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { opacity: 0; transform: translateY(10px); transition: opacity .45s ease, transform .45s ease; }
  body.show { opacity: 1; transform: none; }
  body.bye { opacity: 0; transform: translateY(6px); transition-duration: .3s; }
  #paper { position: absolute; left: 0; display: block; pointer-events: none; }
  #drag { position: absolute; left: 0; top: 0; -webkit-app-region: drag; }
  #page { position: absolute; display: flex; flex-direction: column; color: var(--ink); }
  #page.zh { font-family: "DFKai-SB", "BiauKai", "標楷體", "KaiTi", serif; }
  #page.ja { font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", serif; }
  #page.en { font-family: "Segoe Script", "Brush Script MT", cursive; }
  #page.en .row, #page.en #empty { font-size: .86em; }
  #date { text-align: center; font-size: 1.05em; letter-spacing: .06em; color: var(--ink); }
  #date::after { content: ''; display: block; width: 46%; margin: .35em auto 0; border-top: 1px solid rgba(201,162,74,.55); }
  #weather { margin-top: .55em; font-size: .72em; line-height: 1.45; color: var(--ink2); text-align: center; }
  #weather:empty { display: none; }
  #list { position: relative; margin-top: .7em; flex: 1; overflow: hidden; }
  #empty { margin-top: 2.2em; text-align: center; color: var(--ink2); opacity: .8; font-size: .9em; }
  .row { position: relative; padding: .28em .2em .22em; border-radius: 6px; cursor: pointer; }
  .row:hover { background: rgba(255,255,255,.38); }
  .line { position: relative; display: flex; align-items: baseline; white-space: nowrap; }
  .ink { display: inline-block; overflow: hidden; text-overflow: ellipsis; max-width: 74%; }
  .time { margin-right: .55em; font-size: .9em; color: var(--ink2); }
  .row.due .time::before { content: '✦'; color: var(--gold); font-size: .7em; margin-right: .25em; }
  .tag { margin-left: auto; padding-left: .5em; font-size: .68em; color: var(--ink2); }
  .tag.pending { color: var(--rose); }
  .row.struck .ink { color: rgba(91,70,54,.55); }
  .strike { position: absolute; left: .1em; height: 1.6px; width: 0; background: var(--ink2); border-radius: 1px; pointer-events: none; }
  .reason { margin: .1em 0 0 1.6em; font-size: .72em; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reason:empty { display: none; }
  .ask { display: flex; gap: .3em; margin: .3em 0 .1em 1.2em; font-size: .72em; }
  .ask input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: rgba(255,255,255,.7); border: 1px solid rgba(201,162,74,.6); border-radius: 5px; padding: .15em .4em; outline: none; }
  button { font: inherit; color: var(--ink); background: rgba(255,255,255,.75); border: 1px solid rgba(201,162,74,.7); border-radius: 999px; padding: .12em .7em; cursor: pointer; }
  button:hover { background: #fff; }
  #menu { position: absolute; display: none; gap: .35em; padding: .3em; z-index: 5; font-size: .74em; background: rgba(255,250,244,.96); border: 1px solid rgba(201,162,74,.55); border-radius: 10px; box-shadow: 0 3px 10px rgba(120,90,60,.18); }
  #menu.on { display: flex; }
  #close { position: absolute; font-size: .7em; background: rgba(255,255,255,.55); }
  #pen { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 10; filter: drop-shadow(1px 2px 2px rgba(120,90,60,.25)); }
</style>
</head>
<body>
<img id="paper" src="../assets/note/paper.webp" alt="">
<div id="drag"></div>
<div id="page">
  <div id="date"></div>
  <div id="weather"></div>
  <div id="list"></div>
</div>
<div id="menu"></div>
<button id="close"></button>
<img id="pen" alt="">
<script src="../lib/i18n-ja.js"></script>
<script src="../lib/i18n-en.js"></script>
<script src="../lib/i18n.js"></script>
<script src="note.js"></script>
</body>
</html>
